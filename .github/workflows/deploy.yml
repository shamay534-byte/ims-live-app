name: Update model data and deploy

on:
  push:
    branches: [main]
  schedule:
    # every 3 hours; new IMS maps and ECMWF 0.1° runs appear a few hours after 00Z/12Z
    - cron: '20 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt

      # Re-use the last processed ECMWF run; the script skips work when the run is unchanged.
      - name: Restore ECMWF data
        uses: actions/cache@v4
        with:
          path: public/data/ecmwf
          key: ecmwf-${{ github.run_id }}
          restore-keys: ecmwf-

      - name: IMS model-map catalogue (ICON-IL / COSMO-IL)
        run: python scripts/ims_manifest.py

      - name: ECMWF IFS 0.1° (GRIB2 -> cropped binary grids)
        continue-on-error: true
        run: python scripts/ecmwf_fetch.py --workers 12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
